<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Magic Mouse Ergonomic Contour -->
    <path d="M19 28 C19 16, 25 10, 32 10 C39 10, 45 16, 45 28 L45 44 C45 52, 39 58, 32 58 C25 58, 19 52, 19 44 Z" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Touch Sensor Center Line -->
    <line x1="32" y1="12" x2="32" y2="28" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Lower Grip Curve -->
    <path d="M23 46 C25 50, 29 53, 32 53 C35 53, 39 50, 41 46" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" fill="none" />
  
  </g>
</svg>