<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- MacBook Screen Lid -->
    <rect x="10" y="12" width="44" height="30" rx="4.5" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Camera Notch -->
    <rect x="28.5" y="13" width="7" height="2.5" rx="1.25" fill="url(#eltronGold)" />
    <!-- Unibody Base -->
    <path d="M4 44 L60 44 C61.5 44 62.5 45.2 61 47 L56 53.5 C55 54.5 53.5 55 52 55 L12 55 C10.5 55 9 54.5 8 53.5 L3 47 C1.5 45.2 2.5 44 4 44 Z" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Opener notch on base -->
    <rect x="27" y="44" width="10" height="2.5" rx="1.25" fill="url(#eltronGold)" />
  
  </g>
</svg>