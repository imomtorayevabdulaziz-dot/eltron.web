<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- USB Plug -->
    <rect x="25" y="10" width="14" height="11" rx="2" stroke="url(#eltronGold)" stroke-width="2.5" fill="none" />
    <line x1="28.5" y1="15" x2="35.5" y2="15" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
    <!-- Unibody Casing -->
    <rect x="21" y="21" width="22" height="34" rx="5" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Keyring Loop -->
    <circle cx="32" cy="46" r="3.5" stroke="url(#eltronGold)" stroke-width="2" fill="none" />
    <!-- Speed Bolt -->
    <polygon points="32.5,27 28.5,33 31.5,33 30.5,38 35.5,32 32.5,32" fill="url(#eltronGold)" />
  
  </g>
</svg>