<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FCE6A8" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#A57A18" />
      <stop offset="100%" stop-color="#DEB84A" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F7E6BD" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996E14" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background tile with subtle gold border -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#goldLight)" stroke="url(#eltronGold)" stroke-width="2" />
  
  <!-- Subtle decorative inner line -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Main Art Content -->
  <g filter="url(#softGlow)">
    
    <!-- Adapter Body -->
    <rect x="36" y="38" width="48" height="52" rx="12" stroke="url(#eltronGold)" stroke-width="3.5" fill="#FFFDF8" />
    <!-- AC Prongs -->
    <line x1="48" y1="20" x2="48" y2="38" stroke="url(#eltronGold)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="72" y1="20" x2="72" y2="38" stroke="url(#eltronGold)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Lightning bolt inside adapter -->
    <polygon points="62,48 50,65 59,65 56,80 70,61 60,61" fill="url(#eltronGold)" />
  
  </g>
</svg>