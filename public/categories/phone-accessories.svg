<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- iPhone Unibody Frame -->
    <rect x="16" y="6" width="32" height="52" rx="8" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Dynamic Island Pill -->
    <rect x="26.5" y="10.5" width="11" height="3.5" rx="1.75" fill="url(#eltronGold)" />
    <!-- Home Indicator Bar -->
    <line x1="25" y1="52.5" x2="39" y2="52.5" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Volume & Power ticks -->
    <line x1="13.5" y1="18" x2="13.5" y2="23" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
    <line x1="13.5" y1="26" x2="13.5" y2="31" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
    <line x1="50.5" y1="20" x2="50.5" y2="27" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
    <!-- Center Luxury Sparkle -->
    <polygon points="32,24 33.5,30 39.5,31.5 33.5,33 32,39 30.5,33 24.5,31.5 30.5,30" fill="url(#eltronGold)" />
  
  </g>
</svg>