<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Aluminum Body -->
    <rect x="12" y="28" width="40" height="22" rx="6" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Ports -->
    <rect x="18" y="36" width="7" height="6" rx="1.5" fill="url(#eltronGold)" />
    <rect x="29" y="36" width="7" height="6" rx="1.5" fill="url(#eltronGold)" />
    <rect x="40" y="37.5" width="8" height="3.5" rx="1.75" stroke="url(#eltronGold)" stroke-width="1.5" fill="none" />
    <!-- Host Cable -->
    <path d="M32 28 L32 18 C32 14 29 13 26 13 L18 13" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <rect x="10" y="10.5" width="8" height="5" rx="1.5" fill="url(#eltronGold)" />
  
  </g>
</svg>