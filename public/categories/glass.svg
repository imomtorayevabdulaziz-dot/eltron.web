<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Glass Sheet -->
    <rect x="16" y="8" width="32" height="48" rx="8" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Dynamic Island Notch -->
    <rect x="26.5" y="11" width="11" height="3" rx="1.5" fill="url(#eltronGold)" />
    <!-- Glare Sheen Lines -->
    <line x1="22" y1="46" x2="42" y2="26" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 6" />
    <!-- Hardness Star Sparkle -->
    <polygon points="49,15 50.5,18 53.5,19 50.5,20 49,23 47.5,20 44.5,19 47.5,18" fill="url(#eltronGold)" />
  
  </g>
</svg>