<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FCE6A8" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#A57A18" />
      <stop offset="100%" stop-color="#DEB84A" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F7E6BD" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996E14" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background tile with subtle gold border -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#goldLight)" stroke="url(#eltronGold)" stroke-width="2" />
  
  <!-- Subtle decorative inner line -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Main Art Content -->
  <g filter="url(#softGlow)">
    
    <!-- Top Strap -->
    <path d="M48 40 L48 20 C48 18 50 16 52 16 L68 16 C70 16 72 18 72 20 L72 40" stroke="url(#eltronGold)" stroke-width="3" fill="#FFFDF8" />
    <!-- Bottom Strap -->
    <path d="M48 80 L48 100 C48 102 50 104 52 104 L68 104 C70 104 72 102 72 100 L72 80" stroke="url(#eltronGold)" stroke-width="3" fill="#FFFDF8" />
    <!-- Watch Case Round Squircle -->
    <rect x="36" y="36" width="48" height="48" rx="16" stroke="url(#eltronGold)" stroke-width="3.5" fill="#FFFDF8" />
    <!-- Digital Crown on right -->
    <rect x="84" y="46" width="5" height="12" rx="2.5" fill="url(#eltronGold)" />
    <!-- Inner dial display -->
    <circle cx="60" cy="60" r="15" stroke="url(#eltronGold)" stroke-width="2" stroke-dasharray="5 3" fill="none" />
    <line x1="60" y1="60" x2="60" y2="51" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="60" y1="60" x2="68" y2="60" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
  
  </g>
</svg>