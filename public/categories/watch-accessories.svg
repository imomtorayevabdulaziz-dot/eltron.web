<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Milanese Loop Straps -->
    <path d="M23 18 L23 8 L41 8 L41 18" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M23 46 L23 56 L41 56 L41 46" stroke="url(#eltronGold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Watch Squircle Case -->
    <rect x="17" y="16" width="30" height="32" rx="10" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Digital Crown -->
    <rect x="47" y="22" width="3" height="8" rx="1.5" fill="url(#eltronGold)" />
    <!-- Dial Hands -->
    <circle cx="32" cy="32" r="8" stroke="url(#eltronGold)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <line x1="32" y1="32" x2="32" y2="27" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="32" x2="37" y2="32" stroke="url(#eltronGold)" stroke-width="2" stroke-linecap="round" />
  
  </g>
</svg>