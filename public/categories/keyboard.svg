<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Keyboard Enclosure -->
    <rect x="8" y="18" width="48" height="30" rx="5" stroke="url(#eltronGold)" stroke-width="3" fill="none" />
    <!-- Key Rows -->
    <rect x="13" y="23" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="21" y="23" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="29" y="23" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="37" y="23" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="45" y="23" width="6" height="4" rx="1" fill="url(#eltronGold)" />
    
    <rect x="13" y="30" width="6" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="22" y="30" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="30" y="30" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="38" y="30" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    <rect x="46" y="30" width="5" height="4" rx="1" fill="url(#eltronGold)" />
    
    <!-- Spacebar -->
    <rect x="20" y="37" width="24" height="4" rx="1.5" fill="url(#eltronGold)" />
  
  </g>
</svg>