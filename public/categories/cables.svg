<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Eltron Official Metallic Gold Gradient (sampled from Eltron logo) -->
    <linearGradient id="eltronGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6BA" />
      <stop offset="25%" stop-color="#FFDF65" />
      <stop offset="55%" stop-color="#E6B83E" />
      <stop offset="85%" stop-color="#BC8D1A" />
      <stop offset="100%" stop-color="#EBBF48" />
    </linearGradient>

    <!-- Eltron Highlight Sheen -->
    <linearGradient id="eltronGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E6B83E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Metallic Gold Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#A67900" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Pure Apple SF Symbol Artwork in Eltron Gold (No outer box!) -->
  <g filter="url(#goldGlow)">
    
    <!-- Plug 1 -->
    <rect x="8" y="18" width="14" height="11" rx="3" stroke="url(#eltronGold)" stroke-width="2.5" fill="none" />
    <rect x="3" y="21" width="5" height="5" rx="1.5" fill="url(#eltronGold)" />
    <!-- Plug 2 -->
    <rect x="42" y="35" width="14" height="11" rx="3" stroke="url(#eltronGold)" stroke-width="2.5" fill="none" />
    <rect x="56" y="38" width="5" height="5" rx="1.5" fill="url(#eltronGold)" />
    <!-- Smooth S-Curve Woven Wire -->
    <path d="M22 23.5 C46 23.5, 18 40.5, 42 40.5" stroke="url(#eltronGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  
  </g>
</svg>