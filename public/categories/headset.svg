<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Metallic Eltron Gold Sheen (Apple hardware style) -->
    <linearGradient id="appleGoldSheen" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F5D075" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#A2771B" />
      <stop offset="100%" stop-color="#E8C35E" />
    </linearGradient>

    <!-- Secondary Soft Gold Tone for inner accents / fills -->
    <linearGradient id="appleGoldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0" />
      <stop offset="100%" stop-color="#F8EDD3" />
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="appleGoldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7DC" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#916912" />
    </linearGradient>

    <!-- Apple Ambient Drop Shadow for Icon Elements -->
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#A57A18" flood-opacity="0.22" />
    </filter>

    <!-- Squircle Container Ambient Glow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Apple Squircle Container (continuous 26px radius) -->
  <rect x="5" y="5" width="110" height="110" rx="26" fill="url(#appleGoldSoft)" stroke="url(#appleGoldRim)" stroke-width="1.5" filter="url(#tileShadow)" />
  
  <!-- Subtle inner ambient light rim -->
  <rect x="7" y="7" width="106" height="106" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.7" />

  <!-- Apple SF-style Gold Artwork -->
  <g filter="url(#appleShadow)">
    
    <!-- Breathable Knit Mesh Canopy Headband -->
    <path d="M34 60 C34 34, 44 20, 60 20 C76 20, 86 34, 86 60" stroke="url(#appleGoldSheen)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M40 50 C44 28, 52 24, 60 24 C68 24, 76 28, 80 50" stroke="url(#appleGoldSheen)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <!-- Left Anodized Aluminum Ear Cup -->
    <rect x="22" y="54" width="18" height="30" rx="9" stroke="url(#appleGoldSheen)" stroke-width="3" fill="#FFFFFF" />
    <!-- Right Anodized Aluminum Ear Cup -->
    <rect x="80" y="54" width="18" height="30" rx="9" stroke="url(#appleGoldSheen)" stroke-width="3" fill="#FFFFFF" />
    <!-- Digital Crown on Ear Cup -->
    <rect x="85" y="49" width="8" height="4" rx="2" fill="url(#appleGoldSheen)" />
    <!-- Acoustic Mesh Inset -->
    <ellipse cx="31" cy="69" rx="4.5" ry="8" fill="url(#appleGoldSheen)" />
    <ellipse cx="89" cy="69" rx="4.5" ry="8" fill="url(#appleGoldSheen)" />
  
  </g>
</svg>